                      <circle cx="88" cy="54" r="24" fill="#FAD4DB" stroke="#D97B8C" stroke-width="2" />
                      <text x="88" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#3B332F">Character</text>
                      <text x="88" y="64" text-anchor="middle" font-size="10" fill="#6B5E57">(${lc.Character || 15})</text>
                      <circle cx="332" cy="54" r="24" fill="#FDE9A8" stroke="#D4A12A" stroke-width="2" />
                      <text x="332" y="51" text-anchor="middle" font-size="10" font-weight="700" fill="#3B332F">Event</text>
                      <text x="332" y="64" text-anchor="middle" font-size="10" fill="#6B5E57">(${lc.Event || 13})</text>
                      <circle cx="84" cy="168" r="24" fill="#C7EED8" stroke="#4BA475" stroke-width="2" />
                      <text x="84" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#3B332F">Place</text>
                      <text x="84" y="178" text-anchor="middle" font-size="10" fill="#6B5E57">(${lc.Place || 9})</text>
                      <circle cx="336" cy="168" r="24" fill="#E2D6FC" stroke="#8465C9" stroke-width="2" />
                      <text x="336" y="165" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3B332F">Cultural</text>
                      <text x="336" y="178" text-anchor="middle" font-size="10" fill="#6B5E57">(${lc.CulturalElement || 8})</text>
                      <circle cx="210" cy="190" r="22" fill="#CBE4FA" stroke="#508EC7" stroke-width="2" />
                      <text x="210" y="187" text-anchor="middle" font-size="10" font-weight="700" fill="#3B332F">Object</text>
                      <text x="210" y="199" text-anchor="middle" font-size="10" fill="#6B5E57">(${lc.Object || 10})</text>
                    </svg>
                    `
                    : `
                    <ul class="info-list">
                      ${proj.insights.map((ins) => `<li>${escapeHtml(ins)}</li>`).join('')}
                    </ul>
                    `
                }
              </div>
            </div>

            ${
              proj.hasDataExplorerLink
                ? `
                <div class="detail-card" style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px">
                  <div style="flex:1; min-width:240px">
                    <h3 style="margin-bottom:8px">주요 인사이트 &amp; 기여</h3>
                    <ul class="info-list">
                      ${proj.insights.map((ins) => `<li>${escapeHtml(ins)}</li>`).join('')}
                    </ul>
                  </div>
                  <button type="button" class="btn-primary" id="jumpToExplorerBtn">
                    데이터 탐색 탭에서 그래프 탐색하기 →
                  </button>
                </div>
                `
                : ''
            }
          `;

          document.getElementById('backToProjectsBtn').addEventListener('click', () => {
            state.selectedProjectId = null;
            detailEl.style.display = 'none';
            document.getElementById('projectsListView').style.display = 'block';
          });

          const jumpBtn = document.getElementById('jumpToExplorerBtn');
          if (jumpBtn) {
            jumpBtn.addEventListener('click', () => switchView('explorer'));
          }
        }

        // -------------------------------------------------------------------
        // Data Explorer: Filters, SVG Graph Rendering & Inspector
        // -------------------------------------------------------------------
        function loadGraphIntoState(rawInput, sourceLabel) {
          const parsed = parseNeo4jData(rawInput);
          const g = state.graph;
          g.nodes = parsed.nodes;
          g.edges = parsed.edges;
          g.nodeMap = parsed.nodeMap;
          g.labelCounts = parsed.labelCounts;
          g.relCounts = parsed.relCounts;
          g.activeLabels = new Set(Object.keys(parsed.labelCounts));
          g.activeRels = new Set(Object.keys(parsed.relCounts));
          g.searchQuery = '';
          g.selectedNodeId = null;
          g.hoveredNodeId = null;
          g.zoom = 1;
          g.panX = 0;
          g.panY = 0;
          g.customSourceName = sourceLabel || '';
          g.posMap = computeLayout(g.nodes, g.edges);

          const searchEl = document.getElementById('graphSearchInput');
          if (searchEl) searchEl.value = '';
          renderExplorerControls();
          renderGraphCanvas();
          renderInspector();
        }

        function getFilteredGraph() {
          const g = state.graph;
          const q = g.searchQuery.trim().toLowerCase();
          const visibleNodes = g.nodes.filter((n) => {
            if (!g.activeLabels.has(n.primaryLabel)) return false;
            if (!q) return true;
            const hay = [
              n.name,
              n.properties.name_kor,
              n.properties.id,
              n.properties.type,
              n.properties.personality,
              n.properties.skills,
              n.primaryLabel
            ]
              .filter(Boolean)
              .join(' ')
              .toLowerCase();
            return hay.includes(q);
          });
          const visSet = new Set(visibleNodes.map((n) => n.id));
          const visibleEdges = g.edges.filter(
            (e) => g.activeRels.has(e.label) && visSet.has(e.source) && visSet.has(e.target)
          );
          return { visibleNodes, visibleEdges };
        }

        function renderExplorerControls() {
          const g = state.graph;
          const labelOrder = ['Character', 'Event', 'Place', 'Object', 'CulturalElement', 'Unknown'];
          const labels = Object.keys(g.labelCounts).sort(
            (a, b) => (labelOrder.indexOf(a) === -1 ? 99 : labelOrder.indexOf(a)) - (labelOrder.indexOf(b) === -1 ? 99 : labelOrder.indexOf(b))
          );

          document.getElementById('labelFilterList').innerHTML = labels
            .map((lbl) => {
              const meta = LABEL_META[lbl] || LABEL_META.Unknown;
              const checked = g.activeLabels.has(lbl) ? 'checked' : '';
              return `
                <label class="check-row">
                  <span class="check-left">
                    <input type="checkbox" data-filter-label="${escapeAttr(lbl)}" ${checked} />
                    <span class="swatch-dot" style="background:${meta.fill}; border-color:${meta.stroke}"></span>
                    <span class="check-label-text">${escapeHtml(lbl)} (${escapeHtml(meta.ko)})</span>
                  </span>
                  <span class="check-count tabular-nums">${g.labelCounts[lbl]}</span>
                </label>
              `;
            })
            .join('');

          const rels = Object.keys(g.relCounts).sort((a, b) => g.relCounts[b] - g.relCounts[a]);
          document.getElementById('relFilterList').innerHTML = rels
            .map((rel) => {
              const checked = g.activeRels.has(rel) ? 'checked' : '';
              return `
                <label class="check-row">
                  <span class="check-left">
                    <input type="checkbox" data-filter-rel="${escapeAttr(rel)}" ${checked} />
                    <span class="check-label-text" style="font-family:var(--font-mono); font-size:0.75rem">${escapeHtml(rel)}</span>
                  </span>
                  <span class="check-count tabular-nums">${g.relCounts[rel]}</span>
                </label>
              `;
            })
            .join('');

          document.querySelectorAll('[data-filter-label]').forEach((cb) => {
            cb.addEventListener('change', () => {
              const lbl = cb.getAttribute('data-filter-label');
              if (cb.checked) g.activeLabels.add(lbl);
              else g.activeLabels.delete(lbl);
              renderGraphCanvas();
              renderInspector();
            });
          });

          document.querySelectorAll('[data-filter-rel]').forEach((cb) => {
            cb.addEventListener('change', () => {
              const rel = cb.getAttribute('data-filter-rel');
              if (cb.checked) g.activeRels.add(rel);
              else g.activeRels.delete(rel);
              renderGraphCanvas();
              renderInspector();
            });
          });
        }

        function updateGraphTransform() {
          const vp = document.getElementById('graphViewport');
          const g = state.graph;
          vp.setAttribute('transform', `translate(${g.panX}, ${g.panY}) scale(${g.zoom})`);
        }

        function renderGraphCanvas() {
          const g = state.graph;
          const { visibleNodes, visibleEdges } = getFilteredGraph();
          const edgesLayer = document.getElementById('edgesLayer');
          const nodesLayer = document.getElementById('nodesLayer');

          const selectedId = g.selectedNodeId;
          const connectedNeighbors = new Set();
          if (selectedId) {
            connectedNeighbors.add(selectedId);
            visibleEdges.forEach((e) => {
              if (e.source === selectedId) connectedNeighbors.add(e.target);
              if (e.target === selectedId) connectedNeighbors.add(e.source);
            });
          }

          if (visibleNodes.length === 0) {
            edgesLayer.innerHTML = '';
            nodesLayer.innerHTML = `
              <text x="450" y="320" text-anchor="middle" fill="#8C7E76" font-size="14" font-weight="600">
                조건에 맞는 노드가 없습니다. 필터나 검색어를 초기화해 주세요.
              </text>
            `;
            document.getElementById('graphStatusBar').textContent = '표시 중인 노드 0 · 관계 0';
            updateGraphTransform();
            return;
          }

          // Render edges
          edgesLayer.innerHTML = visibleEdges
            .map((e) => {
              const p1 = g.posMap.get(e.source);
              const p2 = g.posMap.get(e.target);
              if (!p1 || !p2) return '';
              const isFocus = selectedId && (e.source === selectedId || e.target === selectedId);
              const opacity = selectedId ? (isFocus ? 0.95 : 0.12) : 0.52;
              const stroke = isFocus ? '#D45B6C' : '#C9BCA6';
              const strokeWidth = isFocus ? 2.2 : 1.3;
              const marker = isFocus ? 'url(#arrowActive)' : 'url(#arrowDefault)';
              const mx = (p1.x + p2.x) / 2;
              const my = (p1.y + p2.y) / 2;
              return `
                <g opacity="${opacity}">
                  <line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"
                    stroke="${stroke}" stroke-width="${strokeWidth}" marker-end="${marker}" />
                  ${
                    isFocus
                      ? `<rect x="${(mx - 38).toFixed(1)}" y="${(my - 9).toFixed(1)}" width="76" height="16" rx="5" fill="#FFFDF7" stroke="#E8B8C0" stroke-width="0.8" />
                         <text x="${mx.toFixed(1)}" y="${(my + 2.5).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B84A5B" font-family="JetBrains Mono, monospace">${escapeHtml(e.label)}</text>`
                      : ''
                  }
                </g>
              `;
            })
            .join('');

          // Render nodes
          nodesLayer.innerHTML = visibleNodes
            .map((n) => {
              const p = g.posMap.get(n.id);
              if (!p) return '';
              const meta = LABEL_META[n.primaryLabel] || LABEL_META.Unknown;
              const isSelected = selectedId === n.id;
              const isNeighbor = connectedNeighbors.has(n.id);
              const opacity = selectedId ? (isNeighbor ? 1 : 0.22) : 1;
              const radius = isSelected ? 22 : Math.min(21, 13 + Math.sqrt(n.degree) * 1.9);
              const strokeColor = isSelected ? '#B84A5B' : meta.stroke;
              const strokeWidth = isSelected ? 3.2 : 2;
              const shortLabel = n.name.length > 8 ? n.name.slice(0, 7) + '…' : n.name;

              return `
                <g class="graph-node" data-node-id="${escapeAttr(n.id)}" transform="translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)})" opacity="${opacity}" style="cursor:pointer">
                  ${isSelected ? `<circle r="${radius + 5}" fill="none" stroke="#F4A8B4" stroke-width="2.5" />` : ''}
                  <circle r="${radius}" fill="${meta.fill}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />
                  <text y="3.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3B332F" pointer-events="none">${escapeHtml(n.properties.id || n.primaryLabel.slice(0, 2))}</text>
                  <text y="${radius + 13}" text-anchor="middle" font-size="10.5" font-weight="${isSelected || isNeighbor ? '700' : '600'}" fill="#3B332F" paint-order="stroke" stroke="#FFFDF7" stroke-width="3" pointer-events="none">${escapeHtml(shortLabel)}</text>
                </g>
              `;
            })
            .join('');

          updateGraphTransform();
          const selectedText = selectedId && g.nodeMap.get(selectedId) ? ` · 선택: ${g.nodeMap.get(selectedId).name}` : ' (노드를 클릭하면 연결 관계가 강조됩니다)';
          document.getElementById('graphStatusBar').textContent =
            `표시 노드 ${visibleNodes.length}/${g.nodes.length} · 표시 관계 ${visibleEdges.length}/${g.edges.length}${selectedText}`;
        }

        function focusNode(nodeId) {
          const g = state.graph;
          g.selectedNodeId = nodeId;
          g.inspectorTab = 'node';
          const p = g.posMap.get(nodeId);
          if (p) {
            g.panX = 450 - p.x * g.zoom;
            g.panY = 325 - p.y * g.zoom;
          }
          renderGraphCanvas();
          renderInspector();
        }

        function renderInspector() {
          const g = state.graph;
          document.querySelectorAll('[data-inspector]').forEach((tab) => {
            tab.classList.toggle('active', tab.getAttribute('data-inspector') === g.inspectorTab);
          });

          const body = document.getElementById('inspectorBody');
          const { visibleNodes, visibleEdges } = getFilteredGraph();
          const isolatedCount = g.nodes.filter((n) => n.degree === 0).length;

          if (g.inspectorTab === 'overview') {
            const labelOrder = ['Character', 'Event', 'Place', 'Object', 'CulturalElement'];
            const maxLabelCount = Math.max(1, ...Object.values(g.labelCounts));
            const topRels = Object.entries(g.relCounts)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 6);
            const maxRelCount = Math.max(1, ...topRels.map((r) => r[1]));

            body.innerHTML = `
              <div class="kpi-row">
                <div class="kpi-box" style="background:#FDEFEF">
                  <div class="kpi-label">전체 노드 수</div>
                  <div class="kpi-value tabular-nums" style="color:#B84A5B">${g.nodes.length}</div>
                </div>
                <div class="kpi-box" style="background:#EEF6FD">
                  <div class="kpi-label">전체 관계 수</div>
                  <div class="kpi-value tabular-nums" style="color:#3B7BB8">${g.edges.length}</div>
                </div>
                <div class="kpi-box" style="background:#EFF9F2">
                  <div class="kpi-label">고립 노드</div>
                  <div class="kpi-value tabular-nums" style="color:#2F855A">${isolatedCount}</div>
                </div>
              </div>

              <div class="bar-chart-block">
                <h4 class="bar-chart-title">클래스별 노드 수</h4>
                ${labelOrder
                  .filter((l) => g.labelCounts[l])
                  .map((l) => {
                    const cnt = g.labelCounts[l] || 0;
                    const pct = Math.round((cnt / maxLabelCount) * 100);
                    const meta = LABEL_META[l] || LABEL_META.Unknown;
                    return `
                      <div class="bar-row">
                        <span class="bar-name">${escapeHtml(l)}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${meta.bar}"></div></div>
                        <span class="bar-num tabular-nums">${cnt}</span>
                      </div>
                    `;
                  })
                  .join('')}
              </div>

              <div class="bar-chart-block">
                <h4 class="bar-chart-title">관계 유형별 개수 (상위)</h4>
                ${topRels
                  .map(([rel, cnt]) => {
                    const pct = Math.round((cnt / maxRelCount) * 100);
                    return `
                      <div class="bar-row">
                        <span class="bar-name" style="font-family:var(--font-mono); font-size:0.7rem">${escapeHtml(rel)}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:#B5A4E6"></div></div>
                        <span class="bar-num tabular-nums">${cnt}</span>
                      </div>
                    `;
                  })
                  .join('')}
              </div>

              <div class="bar-chart-block" style="background:#FFF8E9; margin-bottom:0">
                <h4 class="bar-chart-title">인문학적 해석 요약</h4>
                <p style="margin:0; font-size:0.83rem; color:var(--ink-secondary)">
                  현재 필터 기준 <strong>${visibleNodes.length}개 노드</strong>와 <strong>${visibleEdges.length}개 관계</strong>가 표시됩니다.
                  치이카와(19연결)와 세이렌(13연결)을 중심으로 사건의 인과(CAUSES)와 일본 설화·음식 문화(REFLECTS)가 긴밀히 교차합니다.
                </p>
              </div>
            `;
            return;
          }

          if (g.inspectorTab === 'node') {
            const node = g.selectedNodeId ? g.nodeMap.get(g.selectedNodeId) : null;
            if (!node) {
              body.innerHTML = `
                <div class="bar-chart-block" style="text-align:center; padding:28px 16px">
                  <p style="margin:0 0 12px; color:var(--ink-secondary); font-size:0.88rem">
                    그래프에서 노드를 클릭하면 세부 속성(Properties)과 연결된 관계를 확인할 수 있습니다.
                  </p>
                  <button type="button" class="btn-secondary" id="selectChiikawaSampleBtn" style="font-size:0.84rem; min-height:38px">
                    ‘치이카와’ 노드 살펴보기
                  </button>
                </div>
              `;
              const sampleBtn = document.getElementById('selectChiikawaSampleBtn');
              if (sampleBtn) {
                sampleBtn.addEventListener('click', () => {
                  const target = g.nodes.find((n) => n.name === '치이카와') || g.nodes[0];
                  if (target) focusNode(target.id);
                });
              }
              return;
            }

            const meta = LABEL_META[node.primaryLabel] || LABEL_META.Unknown;
            const outEdges = g.edges.filter((e) => e.source === node.id);
            const inEdges = g.edges.filter((e) => e.target === node.id);
            const propEntries = Object.entries(node.properties || {});

            body.innerHTML = `
              <div class="bar-chart-block" style="background:${meta.fill}33">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px">
                  <span style="font-size:0.75rem; font-weight:700; color:${meta.stroke}">${escapeHtml(node.primaryLabel)} · ${escapeHtml(meta.ko)}</span>
                  <button type="button" class="mini-link-btn" id="clearSelectedNodeBtn">선택 해제</button>
                </div>
                <h4 style="margin:0 0 2px; font-family:var(--font-display); font-size:1.2rem; font-weight:800">
                  ${escapeHtml(node.name)}
                </h4>
                <div style="font-size:0.78rem; color:var(--ink-muted)">
                  Neo4j ID: ${escapeHtml(node.id)} · 총 연결 수: ${node.degree}
                </div>
              </div>

              <h4 class="bar-chart-title">속성 (Properties)</h4>
              <table class="prop-table">
                <tbody>
                  ${
                    propEntries.length
                      ? propEntries
                          .map(
                            ([k, v]) => `
                          <tr>
                            <th>${escapeHtml(k)}</th>
                            <td>${escapeHtml(typeof v === 'boolean' ? (v ? '예 (true)' : '아니오 (false)') : String(v))}</td>
                          </tr>
                        `
                          )
                          .join('')
                      : '<tr><td colspan="2" style="color:var(--ink-muted)">등록된 속성이 없습니다.</td></tr>'
                  }
                </tbody>
              </table>

              <h4 class="bar-chart-title">연결된 관계 (${outEdges.length + inEdges.length})</h4>
              <div class="edge-chip-list">
                ${outEdges
                  .map((e) => {
                    const target = g.nodeMap.get(e.target);
                    if (!target) return '';
                    return `
                      <button type="button" class="edge-chip-btn" data-jump-node="${escapeAttr(target.id)}">
                        <span>→ <strong>${escapeHtml(target.name)}</strong></span>
                        <span class="edge-rel-tag">${escapeHtml(e.label)}</span>
                      </button>
                    `;
                  })
                  .join('')}
                ${inEdges
                  .map((e) => {
                    const src = g.nodeMap.get(e.source);
                    if (!src) return '';
                    return `
                      <button type="button" class="edge-chip-btn" data-jump-node="${escapeAttr(src.id)}">
                        <span>← <strong>${escapeHtml(src.name)}</strong></span>
                        <span class="edge-rel-tag">${escapeHtml(e.label)}</span>
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            `;

            document.getElementById('clearSelectedNodeBtn').addEventListener('click', () => {
              g.selectedNodeId = null;
              renderGraphCanvas();
              renderInspector();
            });

            body.querySelectorAll('[data-jump-node]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const nid = btn.getAttribute('data-jump-node');
                const targetNode = g.nodeMap.get(nid);
                if (targetNode) g.activeLabels.add(targetNode.primaryLabel);
                renderExplorerControls();
                focusNode(nid);
              });
            });
            return;
          }

          if (g.inspectorTab === 'hubs') {
            const topHubs = [...g.nodes].sort((a, b) => b.degree - a.degree).slice(0, 12);
            body.innerHTML = `
              <p style="margin:0 0 10px; font-size:0.82rem; color:var(--ink-secondary)">
                연결 중심성(Degree) 기준 상위 노드입니다. 클릭하면 그래프에서 해당 노드의 관계망으로 이동합니다.
              </p>
              <div class="edge-chip-list" style="max-height:460px">
                ${topHubs
                  .map((n, i) => {
                    const meta = LABEL_META[n.primaryLabel] || LABEL_META.Unknown;
                    return `
                      <button type="button" class="edge-chip-btn" data-hub-node="${escapeAttr(n.id)}">
                        <span>
                          <span class="tabular-nums" style="color:var(--ink-muted); margin-right:6px">${i + 1}.</span>
                          <strong>${escapeHtml(n.name)}</strong>
                          <span style="font-size:0.74rem; color:${meta.stroke}; margin-left:4px">${escapeHtml(n.primaryLabel)}</span>
                        </span>
                        <span class="edge-rel-tag tabular-nums">${n.degree} 연결</span>
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            `;
            body.querySelectorAll('[data-hub-node]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const nid = btn.getAttribute('data-hub-node');
                const target = g.nodeMap.get(nid);
                if (target) g.activeLabels.add(target.primaryLabel);
                renderExplorerControls();
                focusNode(nid);
              });
            });
            return;
          }

          // research tab
          body.innerHTML = `
            <p style="margin:0 0 12px; font-size:0.82rem; color:var(--ink-secondary)">
              핵심 연구 질문에 맞춰 관련 클래스와 관계 유형만 필터링해 그래프를 탐색합니다.
            </p>
            <button type="button" class="preset-btn" data-preset="narrative">
              <strong>1. 서사적 인과 연쇄 (사건 · 장소)</strong>
              <span>Event와 Place 중심의 CAUSES · OCCURS_AT 흐름 보기</span>
            </button>
            <button type="button" class="preset-btn" data-preset="cultural">
              <strong>2. 문화적 요소 연결망 (설화 · 음식 · 방언)</strong>
              <span>CulturalElement와 REFLECTS · ASSOCIATED_WITH · REVEALS 보기</span>
            </button>
            <button type="button" class="preset-btn" data-preset="character">
              <strong>3. 캐릭터 관계망 (우정 · 갈등 · 구조)</strong>
              <span>Character 간 FRIENDS_OF · RIVAL_OF · ATTACKS · RESCUES · KIDNAPS</span>
            </button>
            <button type="button" class="preset-btn" data-preset="all">
              <strong>전체 그래프 복원 (55 노드 · 114 관계)</strong>
              <span>모든 클래스와 관계 유형을 다시 표시합니다</span>
            </button>
          `;

          body.querySelectorAll('[data-preset]').forEach((btn) => {
            btn.addEventListener('click', () => applyResearchPreset(btn.getAttribute('data-preset')));
          });
        }

        function applyResearchPreset(preset) {
          const g = state.graph;
          g.selectedNodeId = null;
          g.searchQuery = '';
          document.getElementById('graphSearchInput').value = '';

          if (preset === 'narrative') {
            g.activeLabels = new Set(['Event', 'Place', 'Object']);
            g.activeRels = new Set(['CAUSES', 'OCCURS_AT', 'REVEALS']);
          } else if (preset === 'cultural') {
            g.activeLabels = new Set(['CulturalElement', 'Event', 'Object', 'Character']);
            g.activeRels = new Set(['REFLECTS', 'ASSOCIATED_WITH', 'REVEALS']);
          } else if (preset === 'character') {
            g.activeLabels = new Set(['Character']);
            g.activeRels = new Set(['FRIENDS_OF', 'RIVAL_OF', 'ATTACKS', 'RESCUES', 'KIDNAPS', 'KILLS']);
          } else {
            g.activeLabels = new Set(Object.keys(g.labelCounts));
            g.activeRels = new Set(Object.keys(g.relCounts));
          }
          g.zoom = 1;
          g.panX = 0;
          g.panY = 0;
          renderExplorerControls();
          renderGraphCanvas();
          renderInspector();
        }

        // -------------------------------------------------------------------
        // Graph SVG Dragging, Panning, Zooming & Tooltip Interactions
        // -------------------------------------------------------------------
        function bindGraphInteractions() {
          const svg = document.getElementById('graphSvg');
          const tooltip = document.getElementById('graphTooltip');
          const g = state.graph;

          let draggingNodeId = null;
          let isPanning = false;
          let startClientX = 0;
          let startClientY = 0;
          let startPanX = 0;
          let startPanY = 0;
          let movedDistance = 0;

          function clientToSvg(clientX, clientY) {
            const rect = svg.getBoundingClientRect();
            const scaleX = 900 / rect.width;
            const scaleY = 650 / rect.height;
            return {
              x: (clientX - rect.left) * scaleX,
              y: (clientY - rect.top) * scaleY
            };
          }

          svg.addEventListener('pointerdown', (ev) => {
            const nodeGroup = ev.target.closest('.graph-node');
            startClientX = ev.clientX;
            startClientY = ev.clientY;
            movedDistance = 0;

            if (nodeGroup) {
              draggingNodeId = nodeGroup.getAttribute('data-node-id');
              svg.setPointerCapture(ev.pointerId);
            } else {
              isPanning = true;
              startPanX = g.panX;
              startPanY = g.panY;
              svg.setPointerCapture(ev.pointerId);
            }
          });

          svg.addEventListener('pointermove', (ev) => {
            const rect = svg.getBoundingClientRect();
            const dxClient = ev.clientX - startClientX;
            const dyClient = ev.clientY - startClientY;
            movedDistance = Math.hypot(dxClient, dyClient);

            if (draggingNodeId) {
              const pt = clientToSvg(ev.clientX, ev.clientY);
              const worldX = (pt.x - g.panX) / g.zoom;
              const worldY = (pt.y - g.panY) / g.zoom;
              const p = g.posMap.get(draggingNodeId);
              if (p) {
                p.x = worldX;
                p.y = worldY;
                renderGraphCanvas();
              }
              return;
            }

            if (isPanning) {
              const scaleX = 900 / rect.width;
              const scaleY = 650 / rect.height;
              g.panX = startPanX + dxClient * scaleX;
              g.panY = startPanY + dyClient * scaleY;
              updateGraphTransform();
              return;
            }

            const nodeGroup = ev.target.closest('.graph-node');
            if (nodeGroup) {
              const nid = nodeGroup.getAttribute('data-node-id');
              const node = g.nodeMap.get(nid);
              if (node) {
                const stageRect = document.getElementById('graphStage').getBoundingClientRect();
                tooltip.style.display = 'block';
                tooltip.style.left = Math.min(stageRect.width - 210, ev.clientX - stageRect.left + 14) + 'px';
                tooltip.style.top = Math.max(10, ev.clientY - stageRect.top - 12) + 'px';
                const sub = node.properties.name_kor ? ` (${node.properties.name_kor})` : '';
                tooltip.innerHTML = `<strong>${escapeHtml(node.name + sub)}</strong><br/>${escapeHtml(node.primaryLabel)} · 연결 ${node.degree}개`;
              }
            } else {
              tooltip.style.display = 'none';
            }
          });

          svg.addEventListener('pointerup', (ev) => {
            if (draggingNodeId) {
              if (movedDistance < 5) {
                g.selectedNodeId = draggingNodeId;
                g.inspectorTab = 'node';
                renderGraphCanvas();
                renderInspector();
              }
              draggingNodeId = null;
            } else if (isPanning) {
              if (movedDistance < 5 && ev.target === svg) {
                g.selectedNodeId = null;
                renderGraphCanvas();
                renderInspector();
              }
              isPanning = false;
            }
          });

          svg.addEventListener('pointerleave', () => {
            tooltip.style.display = 'none';
          });

          svg.addEventListener(
            'wheel',
            (ev) => {
              ev.preventDefault();
              const factor = ev.deltaY < 0 ? 1.12 : 0.89;
              const nextZoom = Math.max(0.45, Math.min(2.6, g.zoom * factor));
              const pt = clientToSvg(ev.clientX, ev.clientY);
              g.panX = pt.x - ((pt.x - g.panX) / g.zoom) * nextZoom;
              g.panY = pt.y - ((pt.y - g.panY) / g.zoom) * nextZoom;
              g.zoom = nextZoom;
              updateGraphTransform();
            },
            { passive: false }
          );

          document.getElementById('zoomInBtn').addEventListener('click', () => {
            const next = Math.min(2.6, g.zoom * 1.18);
            g.panX = 450 - ((450 - g.panX) / g.zoom) * next;
            g.panY = 325 - ((325 - g.panY) / g.zoom) * next;
            g.zoom = next;
            updateGraphTransform();
          });

          document.getElementById('zoomOutBtn').addEventListener('click', () => {
            const next = Math.max(0.45, g.zoom * 0.84);
            g.panX = 450 - ((450 - g.panX) / g.zoom) * next;
            g.panY = 325 - ((325 - g.panY) / g.zoom) * next;
            g.zoom = next;
            updateGraphTransform();
          });

          document.getElementById('zoomFitBtn').addEventListener('click', () => {
            g.zoom = 1;
            g.panX = 0;
            g.panY = 0;
            updateGraphTransform();
          });
        }

        // -------------------------------------------------------------------
        // Escaping Helpers
        // -------------------------------------------------------------------
        function escapeHtml(str) {
          return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function escapeAttr(str) {
          return escapeHtml(str);
        }

        // -------------------------------------------------------------------
        // App Initialization
        // -------------------------------------------------------------------
        function init() {
          // Navigation listeners
          document.getElementById('homeBtn').addEventListener('click', () => switchView('about'));
          document.querySelectorAll('[data-nav]').forEach((btn) => {
            btn.addEventListener('click', () => switchView(btn.getAttribute('data-nav')));
          });
          document.getElementById('heroProjectsBtn').addEventListener('click', () => switchView('projects'));
          document.getElementById('heroExplorerBtn').addEventListener('click', () => switchView('explorer'));

          // Explorer control listeners
          document.getElementById('graphSearchInput').addEventListener('input', (ev) => {
            state.graph.searchQuery = ev.target.value;
            renderGraphCanvas();
          });

          document.getElementById('toggleAllLabelsBtn').addEventListener('click', () => {
            const g = state.graph;
            const allKeys = Object.keys(g.labelCounts);
            if (g.activeLabels.size === allKeys.length) g.activeLabels.clear();
            else g.activeLabels = new Set(allKeys);
            renderExplorerControls();
            renderGraphCanvas();
            renderInspector();
          });

          document.getElementById('toggleAllRelsBtn').addEventListener('click', () => {
            const g = state.graph;
            const allKeys = Object.keys(g.relCounts);
            if (g.activeRels.size === allKeys.length) g.activeRels.clear();
            else g.activeRels = new Set(allKeys);
            renderExplorerControls();
            renderGraphCanvas();
            renderInspector();
          });

          document.getElementById('resetGraphBtn').addEventListener('click', () => applyResearchPreset('all'));

          document.getElementById('relayoutGraphBtn').addEventListener('click', () => {
            state.graph.posMap = computeLayout(state.graph.nodes, state.graph.edges);
            state.graph.zoom = 1;
            state.graph.panX = 0;
            state.graph.panY = 0;
            renderGraphCanvas();
          });

          document.querySelectorAll('[data-inspector]').forEach((tab) => {
            tab.addEventListener('click', () => {
              state.graph.inspectorTab = tab.getAttribute('data-inspector');
              renderInspector();
            });
          });

          document.getElementById('neo4jFileInput').addEventListener('change', (ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
              loadGraphIntoState(e.target.result, file.name);
            };
            reader.readAsText(file, 'utf-8');
          });

          // Initial load
          loadGraphIntoState(NEO4J_RAW_DATA);
          renderAbout();
          renderProjects();
          bindGraphInteractions();
        }

        document.addEventListener('DOMContentLoaded', init);
      })();
    </script>
  </body>
</html>
